name: Auth0 discovery and PKCE foundation
on:
  pull_request:
    paths:
      - 'deployment/auth0_login_flow.py'
      - 'deployment/auth0_trusted_jwks.py'
      - 'tests/unit/test_auth0_discovery_pkce_foundation.py'
      - '.github/workflows/auth0-discovery-pkce.yml'
permissions:
  contents: read
jobs:
  auth0-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<47'
      - name: Verify trusted discovery and PKCE state/nonce
        run: PYTHONPATH=. python -m unittest discover -s tests/unit -p 'test_auth0_discovery_pkce_foundation.py' -v

name: Auth0 integrated BFF disposable acceptance
on:
  pull_request:
    paths:
      - 'tests/integration/test_auth0_integrated_bff.py'
      - '.github/workflows/auth0-integrated-bff.yml'
  workflow_dispatch:
jobs:
  integrated-auth0-bff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: alpha_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHA_DISPOSABLE_PG_DSN: 'postgresql://postgres:disposable-only@127.0.0.1:5432/alpha_disposable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Integrated Auth0 login and research BFF acceptance
        run: PYTHONPATH=. python -m unittest discover -s tests/integration -p 'test_auth0_integrated_bff.py' -v

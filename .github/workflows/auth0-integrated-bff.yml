name: Auth0 integrated BFF disposable acceptance
on:
  pull_request:
    paths:
      - 'deployment/staging_authenticated_bff.py'
      - 'deployment/research_dashboard.py'
      - 'deployment/auth0_*.py'
      - 'deployment/isolated_auth0_wsgi.py'
      - 'deployment/postgres_*.py'
      - 'deployment/tenant_credential_broker.py'
      - 'deployment/account_role_research_reader.py'
      - 'packages/alpha_lab/src/alpha_lab/research/paper_account_service.py'
      - 'packages/alpha_lab/src/alpha_lab/research/postgres_paper_security.py'
      - 'tests/integration/test_auth0_integrated_bff.py'
      - 'tests/test_auth0_issuer_callback_regression.py'
      - '.github/workflows/auth0-integrated-bff.yml'
  workflow_dispatch:
jobs:
  integrated-auth0-bff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: alpha_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHA_DISPOSABLE_PG_DSN: 'postgresql://postgres:disposable-only@127.0.0.1:5432/alpha_disposable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Integrated Auth0 login and research BFF acceptance
        run: PYTHONPATH=. python -m pytest -q tests/integration/test_auth0_integrated_bff.py tests/test_auth0_issuer_callback_regression.py

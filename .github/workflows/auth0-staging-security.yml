name: Auth0 staging security (research only)
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/auth0_*.py'
      - 'packages/alpha_lab/src/alpha_lab/research/paper_status_wsgi.py'
      - 'tests/unit/test_auth0_staging.py'
      - '.github/workflows/auth0-staging-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependency range
        run: python -m pip install .
      - name: Run Auth0 adversarial security tests
        run: python -m unittest discover -s tests/unit -p 'test_auth0_staging.py' -v
      - name: Run legacy paper staging tests
        run: python -m unittest discover -s tests/unit -p 'test_paper_*py' -v

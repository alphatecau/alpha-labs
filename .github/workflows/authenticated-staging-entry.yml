name: Authenticated staging entry research tests
on:
  pull_request:
    paths:
      - 'deployment/authenticated_staging_entry.py'
      - 'tests/unit/test_authenticated_staging_entry.py'
      - '.github/workflows/authenticated-staging-entry.yml'
  push:
    branches:
      - 'research/authenticated-staging-entry-integration-*'
jobs:
  entry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: PYTHONPATH=packages/alpha_lab/src python -m unittest discover -s tests/unit -p 'test_authenticated_staging_entry.py' -v

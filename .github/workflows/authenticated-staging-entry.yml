name: Authenticated staging entry research tests
on:
  pull_request:
    paths:
      - 'deployment/authenticated_staging_entry.py'
      - 'tests/unit/test_authenticated_staging_entry.py'
      - 'tests/unit/test_staging_dependency_readiness.py'
      - 'tests/unit/test_staging_tenant_disposable_fixtures.py'
      - 'deployment/staging_dependency_readiness.py'
      - '.github/workflows/authenticated-staging-entry.yml'
jobs:
  entry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: PYTHONPATH=packages/alpha_lab/src python -m unittest discover -s tests/unit -p 'test_authenticated_staging_entry.py' -v
      - run: PYTHONPATH=packages/alpha_lab/src python -m unittest discover -s tests/unit -p 'test_staging_dependency_readiness.py' -v
      - run: PYTHONPATH=packages/alpha_lab/src python -m unittest discover -s tests/unit -p 'test_staging_tenant_disposable_fixtures.py' -v

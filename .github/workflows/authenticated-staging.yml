name: Authenticated staging composition (research only)
on:
  push:
    branches:
      - "research/authenticated-readonly-pg-staging-*"
  pull_request:
    paths:
      - "packages/alpha_lab/src/alpha_lab/research/authenticated_staging_wsgi.py"
      - "packages/alpha_lab/src/alpha_lab/research/postgres_oidc_migration.py"
      - "tests/unit/test_authenticated_staging_wsgi.py"
      - ".github/workflows/authenticated-staging.yml"
  workflow_dispatch:
jobs:
  boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . 'cryptography>=42,<47'
      - run: PYTHONPATH=packages/alpha_lab/src python -m unittest discover -s tests/unit -p 'test_authenticated_staging_wsgi.py' -v
  research-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OIDC test dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Run complete offline research suite with OIDC dependencies
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

name: Backend CI baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . 'pytest>=8,<10' 'psycopg[binary]>=3,<4'
      - name: Unit regression suite
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: python -m pytest -q -ra --strict-markers --strict-config -o addopts='' --junitxml=unit-results.xml tests/unit
      - name: Require discovered tests and zero skipped checks
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("unit-results.xml")
          if not path.exists():
              raise SystemExit("Unit evidence missing: installation or discovery failed")
          suites = list(ET.parse(path).getroot().iter("testsuite"))
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print(counts)
          if counts["tests"] == 0 or any(counts[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("Unit/security evidence failed or contains skipped checks")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: unit-results.xml
          if-no-files-found: error
  runtime-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pip-audit>=2,<3'
      - name: Audit resolved runtime dependencies
        run: |
          python - <<'PY'
          import pathlib, tomllib
          dependencies = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          pathlib.Path("/tmp/alpha-runtime-requirements.txt").write_text("\n".join(dependencies) + "\n")
          PY
          pip-audit --strict -r /tmp/alpha-runtime-requirements.txt

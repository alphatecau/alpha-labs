name: Backend CI baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . 'pytest>=8,<10' 'psycopg[binary]>=3,<4'
      - name: Unit regression suite
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: python -m pytest -q -ra --strict-markers --strict-config -o addopts='' tests/unit

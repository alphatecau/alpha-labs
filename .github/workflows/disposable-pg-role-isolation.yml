name: Disposable PostgreSQL 16 tenant isolation
on:
  pull_request:
    paths:
      - 'deployment/research_role_isolation_fixture.sql'
      - '.github/workflows/disposable-pg-role-isolation.yml'
permissions:
  contents: read
jobs:
  disposable-postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: alpha_disposable_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_disposable_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated disposable database identity
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          test "${{ job.services.postgres.id }}" != ""
          test "${{ github.event_name }}" = "pull_request"
          test "$(psql -h 127.0.0.1 -U postgres -d alpha_disposable_ci -Atc 'select current_database()')" = "alpha_disposable_ci"
      - name: Execute real PostgreSQL RLS adversarial fixture
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d alpha_disposable_ci -f deployment/research_role_isolation_fixture.sql
      - name: Verify fixture cleanup
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d alpha_disposable_ci -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('alpha_isolated_a','alpha_isolated_b')")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d alpha_disposable_ci -Atc "SELECT to_regclass('public.alpha_role_research') IS NULL")" = "t"

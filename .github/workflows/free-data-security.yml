name: Free market data and security checks

on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/data/dual_source_check.py'
      - 'scripts/osv_audit.py'
      - 'tests/unit/test_dual_source_check.py'
      - 'tests/unit/test_osv_audit.py'
      - '.github/workflows/free-data-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline provider and OSV tests
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: python -m unittest discover -s tests/unit -p 'test_dual_source_check.py' -v && python -m unittest discover -s tests/unit -p 'test_osv_audit.py' -v

  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project in isolated runner
        run: python -m pip install -e .
      - name: Verify GitHub Actions API access (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "alpha-labs-ci"})
          with urllib.request.urlopen(req, timeout=15) as response:
              result = json.load(response)
          assert result["id"] == int(os.environ["GH_RUN_ID"])
          print("GitHub Actions metadata verified")
          PY
      - name: Audit installed Python dependencies with OSV
        run: python scripts/osv_audit.py

name: Free local paper terminal acceptance
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/**'
      - 'packages/alpha_lab/src/alpha_lab/data/**'
      - 'tests/unit/**'
      - 'scripts/local_paper_live_smoke.py'
      - '.github/workflows/free-local-paper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing project and test tools
        run: python -m pip install . 'pytest>=8,<10' 'ruff==0.15.22' 'bandit==1.9.4'
      - name: Verify local paper and shared dependencies
        run: |
          ruff check packages deployment tests scripts/local_paper_live_smoke.py
          bandit -q -r packages deployment -ll -f json -o bandit.json
      - name: Offline local paper acceptance
        run: >-
          python -m pytest tests/unit/test_local_*.py
          tests/unit/test_coinbase_future_clock_tolerance.py
          tests/unit/test_live_paper_service.py
          tests/unit/test_paper_commit_boundaries.py
          tests/unit/test_paper_control_checkpoint.py
          tests/unit/test_paper_runtime.py
          tests/unit/test_public_https_security.py
          -q --junitxml=local-paper.xml
      - name: Require complete test results
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('local-paper.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) >= 10
          assert all(int(s.get(k, 0)) == 0 for s in suites for k in ('skipped', 'errors', 'failures'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-paper-${{ matrix.python-version }}
          path: |
            local-paper.xml
            bandit.json
          if-no-files-found: error

name: Free local paper terminal acceptance
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/local_*'
      - 'packages/alpha_lab/src/alpha_lab/research/coinbase_paper_book.py'
      - 'tests/unit/test_local_*'
      - 'tests/unit/test_coinbase_future_clock_tolerance.py'
      - '.github/workflows/free-local-paper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project and test tools
        run: python -m pip install . 'pytest>=8,<10' 'ruff>=0.9,<1'
      - name: Lint local paper additions
        run: python -m ruff check packages/alpha_lab/src/alpha_lab/research/local_multiasset_catalogue.py packages/alpha_lab/src/alpha_lab/research/local_paper_terminal.py tests/unit/test_local_multiasset_catalogue.py tests/unit/test_local_paper_terminal.py tests/unit/test_coinbase_future_clock_tolerance.py
      - name: Local CLI and inherited runtime regression
        run: python -m pytest tests/unit/test_local_multiasset_catalogue.py tests/unit/test_local_paper_terminal.py tests/unit/test_paper_runtime.py tests/unit/test_live_paper_service.py -q --junitxml=local-paper.xml
      - name: Enforce no skipped/failed acceptance
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('local-paper.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) >= 10
          assert all(int(s.get(k, 0)) == 0 for s in suites for k in ('skipped', 'errors', 'failures'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-paper-acceptance
          path: local-paper.xml

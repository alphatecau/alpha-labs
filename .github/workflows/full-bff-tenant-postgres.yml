name: Full authenticated BFF and PostgreSQL tenant acceptance
on:
  pull_request:
    paths:
      - 'alpha_lab/research/paper_account_service.py'
      - 'alpha_lab/research/postgres_paper_security.py'
      - 'deployment/staging_authenticated_bff.py'
      - 'deployment/tenant_credential_broker.py'
      - 'tests/integration/test_account_role_isolation.py'
      - 'tests/integration/tenant_research_fixture.py'
      - '.github/workflows/full-bff-tenant-postgres.yml'
permissions:
  contents: read
jobs:
  bff-postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: alpha_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_rls_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Real PostgreSQL account, session, revocation and BFF tests
        env:
          ALPHA_DISPOSABLE_PG_CI: '1'
          ALPHA_TEST_PG_DSN: 'host=127.0.0.1 port=5432 dbname=alpha_rls_test user=postgres password=ci-disposable-only'
        run: PYTHONPATH=.:tests/integration python -m unittest discover -s tests/integration -p 'test_account_role_isolation.py' -v

name: Isolated PostgreSQL research verification
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/phase3_integrity.py'
      - 'tests/integration/test_postgres_run_registry_isolated.py'
      - '.github/workflows/isolated-postgres-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: alpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_test -d alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_LABS_TEST_POSTGRES_DSN: postgresql://alpha_test:disposable_ci_only@127.0.0.1:5432/alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local research package and disposable test driver
        run: python -m pip install -e . 'psycopg[binary]>=3.2,<4'
      - name: Run isolated PostgreSQL concurrency and persistence tests
        run: python -m unittest discover -s tests/integration -p 'test_postgres_run_registry_isolated.py' -v

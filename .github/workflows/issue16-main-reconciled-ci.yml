name: Issue 16 main-based independent verification
on:
  push:
    branches: [research/issue16-main-reconciled-ci-20261109]
  pull_request:
    paths:
      - tests/unit/test_issue16_independent_adversarial.py
      - .github/workflows/issue16-main-reconciled-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issue16-main-reconciled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: packages/alpha_lab/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for standalone Issue 16 oracle functions
        run: python -m pip install 'pytest>=8,<10'
      - name: Run existing independent Issue 16 oracles on main-based code
        run: python -m pytest -q -ra -o addopts='' tests/unit/test_issue16_independent_adversarial.py
      - name: Run all offline research unit tests and reject skips
        run: |
          python - <<'PY'
          import subprocess,sys
          cmd=[sys.executable,'-m','unittest','discover','-s','tests/unit','-p','test_*.py','-v']
          p=subprocess.run(cmd,text=True,capture_output=True)
          print(p.stdout)
          print(p.stderr)
          if p.returncode or 'skipped=' in p.stderr or 'skipped=' in p.stdout:
              raise SystemExit('FAIL: unit suite failed or contained skips')
          print('PASS: full offline unittest suite with no reported skips')
          PY

name: Level 3 staging prototype checks
on:
  pull_request:
    paths:
      - 'tools/level3_staging/**'
      - 'tests/test_level3_staging_write.py'
      - 'tests/test_level3_mcp_proposals.py'
      - 'tests/test_level3_approval_ledger.py'
      - 'tests/test_level3_ledger_recovery.py'
      - 'tools/level3_staging/signed_create.py'
      - 'tests/test_level3_signed_create.py'
      - 'tests/test_level3_mcp_signed.py'
      - 'tests/test_level3_stdio.py'
      - 'tests/test_level3_operator_approval.py'
      - 'tests/test_level3_readiness.py'
      - 'tests/test_level3_startup_guard.py'
      - 'tests/test_level3_audit_chain.py'
      - 'tests/test_level3_recovery_inspection.py'
      - '.github/workflows/level3-staging-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-approval test dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Compile
        run: python -m py_compile tools/level3_staging/controlled_write.py tools/level3_staging/mcp_proposals.py tools/level3_staging/approval_ledger.py tools/level3_staging/signed_create.py tools/level3_staging/mcp_signed.py tools/level3_staging/mcp_signed_stdio.py tools/level3_staging/operator_approval.py tools/level3_staging/readiness.py tools/level3_staging/startup_guard.py tools/level3_staging/audit_chain.py tools/level3_staging/recovery.py tests/test_level3_staging_write.py tests/test_level3_mcp_proposals.py tests/test_level3_approval_ledger.py tests/test_level3_ledger_recovery.py tests/test_level3_signed_create.py tests/test_level3_mcp_signed.py tests/test_level3_stdio.py tests/test_level3_operator_approval.py tests/test_level3_readiness.py tests/test_level3_startup_guard.py tests/test_level3_audit_chain.py tests/test_level3_recovery_inspection.py
      - name: Run offline staging tests
        run: |
          python -m unittest discover -s tests -p 'test_level3_staging_write.py' -v
          python -m unittest discover -s tests -p 'test_level3_mcp_proposals.py' -v
          python -m unittest discover -s tests -p 'test_level3_approval_ledger.py' -v
          python -m unittest discover -s tests -p 'test_level3_ledger_recovery.py' -v
          python -m unittest discover -s tests -p 'test_level3_signed_create.py' -v
          python -m unittest discover -s tests -p 'test_level3_mcp_signed.py' -v
          python -m unittest discover -s tests -p 'test_level3_stdio.py' -v
          python -m unittest discover -s tests -p 'test_level3_operator_approval.py' -v
          python -m unittest discover -s tests -p 'test_level3_readiness.py' -v
          python -m unittest discover -s tests -p 'test_level3_startup_guard.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_chain.py' -v
          python -m unittest discover -s tests -p 'test_level3_recovery_inspection.py' -v

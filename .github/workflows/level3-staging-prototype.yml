name: Level 3 staging prototype checks
on:
  push:
    branches:
      - research/level3-signed-staging-followup-20261118
      - fix/level3-postmerge-reconciliation-20261119
  pull_request:
    paths:
      - 'tools/level3_staging/**'
      - 'tests/test_level3_drive_*.py'
      - 'tests/test_level3_custody_*.py'
      - 'tests/test_level3_audit_checkpoint_policy.py'
      - 'docs/LEVEL3_DRIVE_RESERVATION_STAGING.sql'
      - 'docs/LEVEL3_CUSTODY_ACCEPTANCE_MATRIX.md'
      - 'docs/LEVEL3_GOOGLE_OAUTH_RECOVERY.md'
      - 'tests/test_level3_staging_write.py'
      - 'tests/test_level3_mcp_proposals.py'
      - 'tests/test_level3_approval_ledger.py'
      - 'tests/test_level3_ledger_recovery.py'
      - 'tools/level3_staging/signed_create.py'
      - 'tests/test_level3_signed_create.py'
      - 'tests/test_level3_mcp_signed.py'
      - 'tests/test_level3_stdio.py'
      - 'tests/test_level3_operator_approval.py'
      - 'tests/test_level3_readiness.py'
      - 'tests/test_level3_startup_guard.py'
      - 'tests/test_level3_audit_chain.py'
      - 'tests/test_level3_recovery_inspection.py'
      - 'tests/test_level3_audit_integration.py'
      - 'tests/test_level3_fault_injection.py'
      - 'tests/test_level3_audit_outbox.py'
      - 'tests/test_level3_audit_reconcile.py'
      - 'tests/test_level3_audit_concurrency.py'
      - 'tests/test_level3_process_kill.py'
      - '.github/workflows/level3-staging-prototype.yml'
      - 'tools/level3_staging/android_probe.py'
      - 'tests/test_level3_isolation_guard.py'
      - 'tests/test_level3_broker.py'
      - 'tests/test_level3_broker_transport.py'
      - 'tests/test_level3_broker_startup.py'
      - 'tests/test_level3_cloud_probe.py'
      - 'deployment/level3_cloud_probe.py'
      - 'tests/test_level3_remote_auth.py'
      - 'tests/test_level3_remote_replay.py'
      - 'tests/test_level3_custody_schema.py'
      - 'tests/test_level3_postgres_custody.py'
      - 'tests/test_level3_postgres_integration.py'
      - 'tests/test_level3_intent_recovery.py'
      - 'tests/test_level3_external_anchor.py'
      - 'tests/test_level3_anchor_continuity.py'
      - 'tests/test_level3_signed_broker_pipeline.py'
      - 'tools/level3_staging/postgres_custody.py'
      - 'tools/level3_staging/intent_recovery.py'
      - 'tools/level3_staging/external_anchor.py'
      - 'tools/level3_staging/anchor_continuity.py'
      - 'tools/level3_staging/signed_broker_pipeline.py'
      - 'deployment/level3_custody_schema.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-approval test dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Compile
        run: python -m py_compile tools/level3_staging/controlled_write.py tools/level3_staging/mcp_proposals.py tools/level3_staging/approval_ledger.py tools/level3_staging/signed_create.py tools/level3_staging/mcp_signed.py tools/level3_staging/mcp_signed_stdio.py tools/level3_staging/operator_approval.py tools/level3_staging/readiness.py tools/level3_staging/startup_guard.py tools/level3_staging/audit_chain.py tools/level3_staging/recovery.py tools/level3_staging/audit_reconcile.py tests/test_level3_staging_write.py tests/test_level3_mcp_proposals.py tests/test_level3_approval_ledger.py tests/test_level3_ledger_recovery.py tests/test_level3_signed_create.py tests/test_level3_mcp_signed.py tests/test_level3_stdio.py tests/test_level3_operator_approval.py tests/test_level3_readiness.py tests/test_level3_startup_guard.py tests/test_level3_audit_chain.py tests/test_level3_recovery_inspection.py tests/test_level3_audit_integration.py tests/test_level3_fault_injection.py tests/test_level3_audit_outbox.py tests/test_level3_audit_reconcile.py
      - name: Signed runtime compatibility probe
        run: python -m tools.level3_staging.android_probe
      - name: Compile broker-backed worker
        run: python -m py_compile tools/level3_staging/broker.py tools/level3_staging/mcp_broker_worker.py tools/level3_staging/mcp_broker_stdio.py tools/level3_staging/broker_stdio_launcher.py tests/test_level3_broker.py
      - name: Broker protocol and denial tests
        run: python -m unittest discover -s tests -p 'test_level3_broker.py' -v
      - name: Broker Unix socket transport tests
        run: python -m unittest discover -s tests -p 'test_level3_broker_transport.py' -v
      - name: PostgreSQL custody transaction and recovery checks
        run: python -m unittest discover -s tests -p 'test_level3_postgres_custody.py' -v
      - name: Isolated custody migration safety checks
        run: python -m unittest discover -s tests -p 'test_level3_custody_schema.py' -v
      - name: Remote authentication and durable replay checks
        run: |
          python -m unittest discover -s tests -p 'test_level3_remote_auth.py' -v
          python -m unittest discover -s tests -p 'test_level3_remote_replay.py' -v
      - name: Crash-injected file intent recovery
        run: python -m unittest discover -s tests -p 'test_level3_intent_recovery.py' -v
      - name: Independent audit anchor verification
        run: python -m unittest discover -s tests -p 'test_level3_external_anchor.py' -v
      - name: Independent audit checkpoint continuity
        run: python -m unittest discover -s tests -p 'test_level3_anchor_continuity.py' -v
      - name: Signed broker safety gate checks
        run: python -m unittest discover -s tests -p 'test_level3_signed_broker_pipeline.py' -v
      - name: Drive custody, reservation, and independent audit policy tests
        run: |
          python -m unittest discover -s tests -p 'test_level3_drive_readback.py' -v
          python -m unittest discover -s tests -p 'test_level3_drive_custody_upload.py' -v
          python -m unittest discover -s tests -p 'test_level3_drive_permission_guard.py' -v
          python -m unittest discover -s tests -p 'test_level3_drive_upload_reservation.py' -v
          python -m unittest discover -s tests -p 'test_level3_custody_manifest.py' -v
          python -m unittest discover -s tests -p 'test_level3_custody_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_checkpoint_policy.py' -v
      - name: Cloud probe fail-closed HTTP contract
        run: python -m unittest discover -s tests -p 'test_level3_cloud_probe.py' -v
      - name: Broker readiness startup rejection tests
        run: python -m unittest discover -s tests -p 'test_level3_broker_startup.py' -v
      - name: Broker custody isolation gate tests
        run: python -m unittest discover -s tests -p 'test_level3_isolation_guard.py' -v
      - name: Run offline staging tests
        run: |
          python -m unittest discover -s tests -p 'test_level3_staging_write.py' -v
          python -m unittest discover -s tests -p 'test_level3_mcp_proposals.py' -v
          python -m unittest discover -s tests -p 'test_level3_approval_ledger.py' -v
          python -m unittest discover -s tests -p 'test_level3_ledger_recovery.py' -v
          python -m unittest discover -s tests -p 'test_level3_signed_create.py' -v
          python -m unittest discover -s tests -p 'test_level3_mcp_signed.py' -v
          python -m unittest discover -s tests -p 'test_level3_stdio.py' -v
          python -m unittest discover -s tests -p 'test_level3_operator_approval.py' -v
          python -m unittest discover -s tests -p 'test_level3_readiness.py' -v
          python -m unittest discover -s tests -p 'test_level3_startup_guard.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_chain.py' -v
          python -m unittest discover -s tests -p 'test_level3_recovery_inspection.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_integration.py' -v
          python -m unittest discover -s tests -p 'test_level3_fault_injection.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_outbox.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_level3_audit_concurrency.py' -v
          python -m unittest discover -s tests -p 'test_level3_process_kill.py' -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: level3_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: level3_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U level3_ci -d level3_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEVEL3_TEST_POSTGRES_DSN: postgresql://level3_ci:ephemeral_ci_only@localhost:5432/level3_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated database test dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run real PostgreSQL custody integration tests
        run: python -m unittest discover -s tests -p 'test_level3_postgres_integration.py' -v

name: Minimal authentication boundary verification
on:
  pull_request:
    paths:
      - 'deployment/verified_proxy_ingress.py'
      - 'deployment/oidc_verifier.py'
      - 'tests/unit/test_verified_proxy_ingress.py'
      - 'tests/unit/test_oidc_verifier.py'
      - '.github/workflows/minimal-auth-boundaries.yml'
permissions:
  contents: read
jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=50.0.0,<51'
      - name: Reject untrusted proxy peer and spoofed forwarded headers
        run: PYTHONPATH=. python -m unittest discover -s tests/unit -p 'test_verified_proxy_ingress.py' -v
      - name: Reject forged or invalid OIDC identity tokens
        run: PYTHONPATH=. python -m unittest discover -s tests/unit -p 'test_oidc_verifier.py' -v

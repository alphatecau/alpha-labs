name: OIDC browser staging security (research only)
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/oidc_*.py'
      - 'tests/unit/test_oidc_*.py'
      - '.github/workflows/oidc-browser-security.yml'
permissions:
  contents: read
jobs:
  oidc-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project with crypto support
        run: python -m pip install .
      - name: Run OIDC browser and durable store adversarial tests
        run: python -m unittest discover -s tests/unit -p 'test_oidc_*.py' -v

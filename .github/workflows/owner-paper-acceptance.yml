name: Owner paper acceptance (disposable only)
on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'packages/alpha_lab/src/alpha_lab/research/**'
      - 'tests/integration/**'
      - 'tests/unit/**paper**'
      - 'apps/sites/owner-paper/**'
      - '.github/workflows/owner-paper-acceptance.yml'
permissions:
  contents: read
jobs:
  owner-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: alpha_rls_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_rls_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ALPHA_DISPOSABLE_PG_CI: '1'
      ALPHA_TEST_PG_DSN: 'host=127.0.0.1 port=5432 dbname=alpha_rls_test user=postgres password=disposable-ci-only'
      PYTHONPATH: 'packages/alpha_lab/src:.:tests/integration'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Verify owner boundary, commits, recovery and actual PostgreSQL quotas
        run: >-
          python -m pytest tests/unit/test_owner_paper_bff.py
          tests/unit/test_paper_commit_boundaries.py
          tests/integration/test_owner_paper_postgres.py
          -v --junitxml=owner-paper.xml
      - name: Reject missing or skipped acceptance evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('owner-paper.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) >= 16
          assert all(int(s.get(k, 0)) == 0 for s in suites for k in ('skipped', 'errors', 'failures'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-paper-evidence
          path: owner-paper.xml

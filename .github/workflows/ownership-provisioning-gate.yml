name: Ownership provisioning authority negative tests
on:
  pull_request:
    paths:
      - 'alpha_lab/research/postgres_paper_security.py'
      - 'alpha_lab/research/paper_account_service.py'
      - 'tests/integration/test_ownership_provisioning_authority.py'
      - '.github/workflows/ownership-provisioning-gate.yml'
permissions:
  contents: read
jobs:
  ownership-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unauthorised account provisioning
        run: PYTHONPATH=. python -m unittest discover -s tests/integration -p 'test_ownership_provisioning_authority.py' -v

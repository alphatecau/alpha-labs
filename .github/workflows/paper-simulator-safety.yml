name: Paper simulator offline safety tests
on:
  push:
    branches:
      - research/paper-simulator-foundation-20261109
  pull_request:
    paths:
      - packages/alpha_lab/src/alpha_lab/research/paper_simulator.py
      - tests/unit/test_paper_simulator.py
      - .github/workflows/paper-simulator-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: packages/alpha_lab/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Adversarial simulator checks without skips
        run: python -m pytest -q -ra --strict-markers --strict-config -o addopts='' tests/unit/test_paper_simulator.py

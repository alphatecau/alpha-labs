name: Alpha Labs Phase 1 evidence engine CI
on:
  push:
    branches: [research/phase1-evidence-engine-20261108]
    paths:
      - '.github/workflows/phase1-evidence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: packages/alpha_lab/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete offline unit suite including adversarial evidence tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Compile Phase 1 evidence modules
        run: python -m py_compile packages/alpha_lab/src/alpha_lab/research/phase1_accounting.py packages/alpha_lab/src/alpha_lab/research/phase1_evidence.py
      - name: Assert no live trading or broker integration introduced in Phase 1 modules
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('packages/alpha_lab/src/alpha_lab/research/phase1_accounting.py'),
                 Path('packages/alpha_lab/src/alpha_lab/research/phase1_evidence.py')]
          for p in paths:
              source=p.read_text()
              assert 'requests.' not in source and 'httpx.' not in source
              assert 'place_order(' not in source and 'create_order(' not in source
          print('PASS: offline evidence modules; no broker integration')
          PY

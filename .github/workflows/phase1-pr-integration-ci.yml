name: Alpha Labs Phase 1 PR integration safety
on:
  pull_request:
    paths:
      - 'packages/alpha_lab/**'
      - 'tests/unit/**'
      - '.github/workflows/phase1-pr-integration-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All Python unit and adversarial tests
        env:
          PYTHONPATH: packages/alpha_lab/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Compile all Python source
        run: python -m compileall -q packages/alpha_lab/src

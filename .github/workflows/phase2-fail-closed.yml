name: Phase 2 fail-closed regression verification

on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/strategy_evidence_bridge.py'
      - 'packages/alpha_lab/src/alpha_lab/research/promotion_authority.py'
      - 'packages/alpha_lab/src/alpha_lab/research/phase2_evidence_gate.py'
      - 'tests/unit/test_phase2_fail_closed_regressions.py'
      - '.github/workflows/phase2-fail-closed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-archive verification dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Execute required Phase 2 regressions
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: |
          python -m unittest discover -s tests/unit -p 'test_phase2_fail_closed_regressions.py' -v
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/unit", pattern="test_phase2_fail_closed_regressions.py"
          )
          result = unittest.TestResult()
          suite.run(result)
          assert result.testsRun >= 6, f"Expected at least six tests, got {result.testsRun}"
          assert not result.skipped and result.wasSuccessful(), "Phase 2 regression suite failed"
          print(f"Verified {result.testsRun} Phase 2 tests executed successfully")
          PY

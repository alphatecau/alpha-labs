name: Phase 2 three-gate research verification

on:
  pull_request:
    paths:
      - 'tools/authorisation_surface_inventory.py'
      - 'tests/unit/test_authorisation_surface_inventory.py'
      - 'tests/unit/test_phase2_archive_boundary_adversarial.py'
      - 'tests/unit/test_assessment_forged_evidence_boundary.py'
      - 'tests/unit/test_phase2_accounting_adversarial.py'
      - '.github/workflows/phase2-three-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run explicit security and research boundary tests
        env:
          PYTHONPATH: packages/alpha_lab/src:.
        run: |
          python -m unittest discover -s tests/unit -p 'test_authorisation_surface_inventory.py' -v
          python -m unittest discover -s tests/unit -p 'test_phase2_archive_boundary_adversarial.py' -v
          python -m unittest discover -s tests/unit -p 'test_assessment_forged_evidence_boundary.py' -v
          python -m unittest discover -s tests/unit -p 'test_phase2_accounting_adversarial.py' -v
          python - <<'PY'
          import unittest
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for pattern in (
              'test_authorisation_surface_inventory.py',
              'test_phase2_archive_boundary_adversarial.py',
              'test_assessment_forged_evidence_boundary.py',
              'test_phase2_accounting_adversarial.py',
          ):
              suite.addTests(loader.discover('tests/unit', pattern=pattern))
          result = unittest.TestResult()
          suite.run(result)
          assert result.testsRun >= 14, f'Only {result.testsRun} tests executed'
          assert not result.skipped and result.wasSuccessful(), 'Research gate tests failed'
          print(f'Confirmed {result.testsRun} tests executed without skips')
          PY
      - name: Inventory research authorisation surfaces
        env:
          PYTHONPATH: packages/alpha_lab/src:.
        run: python tools/authorisation_surface_inventory.py > authorisation-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorisation-surface-inventory
          path: authorisation-inventory.json
          if-no-files-found: warn

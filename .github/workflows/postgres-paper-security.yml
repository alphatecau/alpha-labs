name: PostgreSQL paper security integration (research only)

on:
  push:
    branches:
      - 'research/postgres-real-integration-ci-*'
      - 'research/authenticated-readonly-pg-staging-*'
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/postgres_paper_security.py'
      - 'packages/alpha_lab/src/alpha_lab/research/postgres_oidc_migration.py'
      - 'packages/alpha_lab/src/alpha_lab/research/oidc_postgres_store.py'
      - 'tests/integration/test_postgres_paper_security_real.py'
      - '.github/workflows/postgres-paper-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: alpha_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_test -d alpha_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_TEST_POSTGRES_DSN: postgresql://alpha_test:local_ci_only@localhost:5432/alpha_security_test
      PYTHONPATH: packages/alpha_lab/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated integration dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run real PostgreSQL security integration
        run: python -m unittest discover -s tests/integration -p 'test_postgres_paper_security_real.py' -v

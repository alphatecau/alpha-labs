name: Alpha Labs authenticated read-only API tests
on:
  pull_request:
    paths:
      - 'deployment/research_readonly_*.py'
      - 'deployment/research_rls_isolated.sql'
      - 'deployment/research_rls_transaction_fixture.sql'
      - 'deployment/research_role_isolation_fixture.sql'
      - 'deployment/account_role_research_reader.py'
      - 'deployment/fixed_origin_research_transport.py'
      - 'deployment/auth0_login_flow.py'
      - 'deployment/auth0_staging_settings.py'
      - 'tests/unit/test_auth0_staging_settings.py'
      - 'deployment/auth0_session_controller.py'
      - 'deployment/staging_authenticated_bff.py'
      - 'deployment/staging_authenticated_assembly.py'
      - 'deployment/authenticated_staging_bootstrap.py'
      - 'tests/unit/test_authenticated_staging_bootstrap.py'
      - 'deployment/auth0_trusted_jwks.py'
      - 'deployment/auth0_refreshing_verifier.py'
      - 'deployment/strict_direct_https_ingress.py'
      - 'tests/unit/test_strict_direct_https_ingress.py'
      - 'tests/unit/test_auth0_refreshing_verifier.py'
      - 'deployment/postgres_pkce_state_store.py'
      - 'tests/integration/test_auth_postgres_durable.py'
      - 'tests/unit/test_auth0_trusted_discovery.py'
      - 'tests/unit/test_staging_authenticated_assembly.py'
      - 'tests/unit/test_staging_boundary_adversarial.py'
      - 'tests/unit/test_staging_bff_http_boundaries.py'
      - 'deployment/postgres_opaque_sessions.py'
      - 'tests/unit/test_staging_authenticated_bff.py'
      - 'tests/unit/test_auth0_confidential_exchange.py'
      - 'deployment/sqlite_pkce_state_store.py'
      - 'tests/unit/test_auth0_session_adversarial.py'
      - 'deployment/tenant_credential_broker.py'
      - 'deployment/mounted_tenant_secret_provider.py'
      - 'deployment/render_environment_tenant_secrets.py'
      - 'tests/unit/test_render_environment_tenant_secrets.py'
      - 'tests/unit/test_mounted_tenant_secret_provider.py'
      - 'tests/integration/test_pg_credential_rotation.py'
      - 'tests/unit/test_auth0_broker_preparation.py'
      - 'tests/unit/test_fixed_origin_research_transport.py'
      - 'tests/integration/test_account_role_isolation.py'
      - 'deployment/research_dashboard_bff.py'
      - 'deployment/transaction_scoped_research_reader.py'
      - 'tests/integration/test_bff_postgres_chain.py'
      - 'tests/unit/test_research_dashboard_bff.py'
      - 'deployment/oidc_verifier.py'
      - 'deployment/trusted_site_relay.py'
      - 'tests/unit/test_readonly_research_api.py'
      - 'tests/unit/test_trusted_site_relay.py'
      - 'tests/unit/test_oidc_verifier.py'
      - '.github/workflows/read-only-dashboard-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: alpha_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography for OIDC tests
        run: python -m pip install 'cryptography>=44,<47' 'psycopg[binary]>=3.2,<4'
      - name: Run read-only API, relay and OIDC tests
        run: |
          python -m unittest discover -s tests/unit -p 'test_readonly_research_api.py' -v
          python -m unittest discover -s tests/unit -p 'test_trusted_site_relay.py' -v
          python -m unittest discover -s tests/unit -p 'test_oidc_verifier.py' -v
          python -m unittest discover -s tests/unit -p 'test_fixed_origin_research_transport.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_broker_preparation.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_session_adversarial.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_staging_settings.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_confidential_exchange.py' -v
          python -m unittest discover -s tests/unit -p 'test_staging_authenticated_bff.py' -v
          python -m unittest discover -s tests/unit -p 'test_staging_authenticated_assembly.py' -v
          python -m unittest discover -s tests/unit -p 'test_authenticated_staging_bootstrap.py' -v
          python -m unittest discover -s tests/unit -p 'test_staging_boundary_adversarial.py' -v
          python -m unittest discover -s tests/unit -p 'test_staging_bff_http_boundaries.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_trusted_discovery.py' -v
          python -m unittest discover -s tests/unit -p 'test_auth0_refreshing_verifier.py' -v
          python -m unittest discover -s tests/unit -p 'test_strict_direct_https_ingress.py' -v
          python -m unittest discover -s tests/unit -p 'test_mounted_tenant_secret_provider.py' -v
          python -m unittest discover -s tests/unit -p 'test_render_environment_tenant_secrets.py' -v
      - name: Run isolated PostgreSQL RLS and privilege assertions
        env:
          PGPASSWORD: ci-only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d alpha_rls_test -f deployment/research_rls_isolated.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d alpha_rls_test -f deployment/research_rls_transaction_fixture.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d alpha_rls_test -f deployment/research_role_isolation_fixture.sql

      - name: Run BFF-to-PostgreSQL two-account acceptance
        env:
          ALPHA_TEST_PG_DSN: postgresql://postgres:ci-only@127.0.0.1:5432/alpha_rls_test
          PYTHONPATH: packages/alpha_lab/src:.
        run: python -m unittest discover -s tests/integration -p 'test_bff_postgres_chain.py' -v

      - name: Verify durable PostgreSQL OAuth state and session revocation
        env:
          ALPHA_TEST_PG_DSN: postgresql://postgres:ci-only@127.0.0.1:5432/alpha_rls_test
          PYTHONPATH: packages/alpha_lab/src:.
        run: python -m unittest discover -s tests/integration -p 'test_auth_postgres_durable.py' -v

      - name: Verify tenant-role arbitrary SQL isolation
        env:
          ALPHA_TEST_PG_DSN: postgresql://postgres:ci-only@127.0.0.1:5432/alpha_rls_test
          PYTHONPATH: packages/alpha_lab/src:.
        run: |
          python -m unittest discover -s tests/integration -p 'test_account_role_isolation.py' -v
          python -m unittest discover -s tests/integration -p 'test_pg_credential_rotation.py' -v

name: Real PostgreSQL tenant isolation acceptance
on:
  pull_request:
    paths:
      - 'tests/integration/test_real_tenant_isolation_acceptance.py'
      - '.github/workflows/real-tenant-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-tenant-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: alpha_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_rls_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALPHA_DISPOSABLE_PG_CI: '1'
      ALPHA_TEST_PG_DSN: 'postgresql://postgres:disposable-only@127.0.0.1:5432/alpha_rls_test'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify real tenant roles and forced RLS
        run: PYTHONPATH=.:tests/integration python -m unittest discover -s tests/integration -p 'test_real_tenant_isolation_acceptance.py' -v

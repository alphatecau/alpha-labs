name: Research evidence gate
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/unit/test_*evidence_gate.py'
      - 'tests/unit/test_regime_r1.py'
      - 'packages/alpha_lab/src/alpha_lab/backtest/**'
      - 'packages/alpha_lab/src/alpha_lab/data/csv_import.py'
      - 'packages/alpha_lab/src/alpha_lab/research/strategies/momentum.py'
      - 'packages/alpha_lab/src/alpha_lab/research/strategies/regime_r1.py'
      - 'docs/evidence/2026-11-05_REPRODUCTION_AUDIT.json'
      - '.github/workflows/research-evidence-gate.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/unit/test_*evidence_gate.py'
      - 'tests/unit/test_regime_r1.py'
      - 'packages/alpha_lab/src/alpha_lab/backtest/**'
      - 'packages/alpha_lab/src/alpha_lab/data/csv_import.py'
      - 'packages/alpha_lab/src/alpha_lab/research/strategies/momentum.py'
      - 'packages/alpha_lab/src/alpha_lab/research/strategies/regime_r1.py'
      - 'docs/evidence/2026-11-05_REPRODUCTION_AUDIT.json'
      - '.github/workflows/research-evidence-gate.yml'
permissions:
  contents: read
jobs:
  immutable-economic-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local research package
        run: python -m pip install -e .
      - name: Verify R1 causal signal
        run: python -m unittest discover -s tests/unit -p 'test_regime_r1.py' -v
      - name: Verify immutable audit and independent accounting fixtures
        run: python -m unittest discover -s tests/unit -p 'test_research_evidence_gate.py' -v
      - name: Check the development comparator command
        run: python tools/compare_regime_r1.py --help
      - name: Generate read-only economic report
        run: python tools/research_evidence_gate.py --output economic-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-economic-evidence
          path: economic-evidence.json

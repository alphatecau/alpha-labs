name: Ruff syntax and correctness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.15.22'
      - name: All selected rules without legacy exclusions
        run: ruff check packages deployment tests scripts/engineering_status.py scripts/reconcile_repository.py

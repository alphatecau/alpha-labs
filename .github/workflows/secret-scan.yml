name: Gitleaks secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks release
        env:
          VERSION: '8.24.3'
        run: |
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "/tmp/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && sha256sum --check --ignore-missing gitleaks-checksums.txt)
          tar -xzf "/tmp/gitleaks_${VERSION}_linux_x64.tar.gz" -C /tmp gitleaks
      - name: Scan working tree without revealing findings
        run: /tmp/gitleaks dir --redact --exit-code 1 --no-banner .

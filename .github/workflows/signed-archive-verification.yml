name: Signed archival evidence verification

on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/phase1_signed_archive.py'
      - 'tests/unit/test_phase1_signed_archive.py'
      - 'tests/unit/test_phase2_archive_provenance.py'
      - 'tests/unit/test_phase2_evidence_gate.py'
      - 'packages/alpha_lab/src/alpha_lab/research/phase2_evidence_gate.py'
      - 'packages/alpha_lab/src/alpha_lab/research/phase2_archive_provenance.py'
      - '.github/workflows/signed-archive-verification.yml'
  push:
    branches:
      - main
      - 'research/archive-byte-integrity-*'
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/phase1_signed_archive.py'
      - 'tests/unit/test_phase1_signed_archive.py'
      - 'tests/unit/test_phase2_archive_provenance.py'
      - 'tests/unit/test_phase2_evidence_gate.py'
      - 'packages/alpha_lab/src/alpha_lab/research/phase2_evidence_gate.py'
      - 'packages/alpha_lab/src/alpha_lab/research/phase2_archive_provenance.py'
      - '.github/workflows/signed-archive-verification.yml'

permissions:
  contents: read

jobs:
  signed-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptographic verification dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Require signed archive tests to execute
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: |
          python -c 'import cryptography; print("cryptography", cryptography.__version__)'
          python -m unittest discover -s tests/unit -p 'test_phase*_archive*.py' -v
          python -m unittest discover -s tests/unit -p 'test_phase2_evidence_gate.py' -v
          python -c 'import unittest; r=unittest.TestResult(); unittest.defaultTestLoader.discover("tests/unit",pattern="test_phase2_evidence_gate.py").run(r); assert r.testsRun >= 1 and not r.skipped and r.wasSuccessful(), "Evidence gate test did not execute"'
          python -c 'import unittest; suite=unittest.defaultTestLoader.discover("tests/unit",pattern="test_phase*_archive*.py"); result=unittest.TestResult(); suite.run(result); assert result.testsRun >= 2 and not result.skipped and result.wasSuccessful(), "Archive security tests did not execute successfully"'


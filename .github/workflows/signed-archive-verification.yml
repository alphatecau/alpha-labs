name: Signed archival evidence verification

on:
  pull_request:
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/phase1_signed_archive.py'
      - 'tests/unit/test_phase1_signed_archive.py'
      - '.github/workflows/signed-archive-verification.yml'
  push:
    branches:
      - main
      - 'research/archive-byte-integrity-*'
    paths:
      - 'packages/alpha_lab/src/alpha_lab/research/phase1_signed_archive.py'
      - 'tests/unit/test_phase1_signed_archive.py'
      - '.github/workflows/signed-archive-verification.yml'

permissions:
  contents: read

jobs:
  signed-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptographic verification dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Require signed archive tests to execute
        env:
          PYTHONPATH: packages/alpha_lab/src
        run: |
          python -c 'import cryptography; print("cryptography", cryptography.__version__)'
          python -m unittest discover -s tests/unit -p test_phase1_signed_archive.py -v
          python -c 'import importlib.util,unittest; spec=importlib.util.spec_from_file_location("signed_tests","tests/unit/test_phase1_signed_archive.py"); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); result=unittest.TestResult(); unittest.defaultTestLoader.loadTestsFromModule(mod).run(result); assert result.testsRun >= 1 and not result.skipped and result.wasSuccessful(), "Signed archive tests did not execute successfully"'

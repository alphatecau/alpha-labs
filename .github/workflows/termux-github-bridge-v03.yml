name: Termux bridge v0.3 controller tests
on:
  pull_request:
    paths:
      - 'tools/termux_github_bridge/agent_v3.py'
      - 'tools/termux_github_bridge/test_agent_v3.py'
      - 'tools/termux_github_bridge/worker_v2.py'
      - 'tools/termux_github_bridge/test_worker_v2.py'
      - '.github/workflows/termux-github-bridge-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate supervised polling and worker
        run: cd tools/termux_github_bridge && python -m unittest -v test_agent_v3.py test_worker_v2.py

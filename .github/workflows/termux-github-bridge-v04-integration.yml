name: Termux v0.4 signed worker integration tests
on:
  pull_request:
    paths:
      - 'tools/termux_github_bridge/worker_v4.py'
      - 'tools/termux_github_bridge/test_worker_v4.py'
      - 'tools/termux_github_bridge/signed_protocol_v4.py'
      - '.github/workflows/termux-github-bridge-v04-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Signed worker regression and negative tests
        run: cd tools/termux_github_bridge && python -m unittest -v test_signed_protocol_v4.py test_worker_v4.py test_agent_v3.py test_worker_v2.py

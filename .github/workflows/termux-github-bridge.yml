name: Termux GitHub bridge safety tests
on:
  pull_request:
    paths:
      - 'tools/termux_github_bridge/**'
      - '.github/workflows/termux-github-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test issue request validation
        run: cd tools/termux_github_bridge && python -m unittest -v test_worker.py

# Deployment preparation only. Do not apply until security approval.
services:
  - type: web
    name: alpha-labs-paper-staging
    runtime: python
    region: singapore
    plan: starter
    branch: research/paper-first-copy-trading-gates-20261109
    autoDeploy: false
    buildCommand: python -m pip install . gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 30 alpha_lab.research.paper_staging_wsgi:app
    envVars:
      - key: ALPHA_PAPER_SIGNING_KEY_B64
        sync: false
      - key: ALPHA_PAPER_ISSUER
        sync: false
      - key: ALPHA_PAPER_AUDIENCE
        sync: false
      - key: ALPHA_PAPER_OWNER_SUBJECT
        sync: false
      - key: ALPHA_PAPER_DATA_DIR
        value: /var/data
    disk:
      name: paper-journal-staging
      mountPath: /var/data
      sizeGB: 1

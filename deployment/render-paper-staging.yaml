# SAFE PREPARATION ONLY: non-trading health probe, NOT an owner paper release.
# Do not apply until the operator explicitly approves a new isolated Render service.
# This intentionally exposes NO login, paper order, journal, broker or database endpoint.
# A functional paper BFF cannot be deployed until Auth0, proxy, persistence,
# protected checkpoint and Android acceptance are independently verified.
services:
  - type: web
    name: alpha-labs-private-staging-probe
    runtime: python
    region: singapore
    plan: free
    branch: research/private-staging-gates-20261112
    autoDeploy: false
    buildCommand: python -m pip install .
    startCommand: python deployment/staging_probe.py
    healthCheckPath: /healthz
    envVars:
      # Explicit public bind only for health-only probe. Never for authenticated BFF.
      - key: HOST
        value: "0.0.0.0"
      - key: ALPHA_TRADING_ENABLED
        value: "false"
